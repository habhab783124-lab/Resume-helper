server:
  # 支持用环境变量覆盖，例如本机 8080 被占用时：
  #   $env:SERVER_PORT=8081 ; mvn spring-boot:run
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 1d
      cookie:
        http-only: true
        same-site: lax

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: resume-helper-backend
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  web:
    resources:
      # 前端静态文件的位置，按顺序查找。
      #
      # 最后两项是给「单进程演示」用的：把 frontend/dist 的内容拷到 jar 同级的 webapp/ 目录，
      # 然后一条 `java -jar` 就能同时提供前端页面和后端接口。
      # 这样演示机器上**不需要 Node、不需要 Maven、不需要联网**，只要有 JDK 17。
      # 前后端还同源，连 vite 代理和 CORS 都不用配。
      #
      # 开发时保留 frontend/dist 这一项，方便本地直接跑打包版。
      static-locations:
        - classpath:/META-INF/resources/
        - classpath:/resources/
        - classpath:/static/
        - classpath:/public/
        - file:./webapp/
        - file:./frontend/dist/

app:
  job:
    # 智能体最多检索几轮（换关键词扩检）。轮数越多越费 token。
    max-rounds: 3
    # 最终返回给前端的岗位数量
    default-limit: 12
    # 前 N 个岗位调用大模型生成「为什么匹配 / 差在哪里」，0 表示完全不调用大模型
    explain-top-n: 5
    # 前端的岗位页一次最多取多少条
    max-limit: 50
    cors:
      # 允许跨域的前端来源，支持通配符。
      # 本地开发走 vite 代理时用不到它；前端部署到公网后**必须**把域名加进来，
      # 否则浏览器预检会失败（HTTPS 页面也没法请求 HTTP 后端，那是混合内容拦截）。
      #
      # 例如部署到 Vercel 后追加：
      #   - https://resume-helper-two.vercel.app
      #   - https://*.vercel.app
      allowed-origin-patterns:
        - http://localhost:*
        - http://127.0.0.1:*
    sources:
      # 内置演示岗位库：外部来源不可用时的兜底，保证岗位页永远有内容
      mock-enabled: true
      # 人工整理的 CSV 岗位库。classpath: 或绝对路径都支持。
      csv-enabled: true
      csv-location: classpath:jobs/sample-jobs.csv
    ai:
      # 默认指向 DeepSeek 的 OpenAI 兼容端点；换成通义/豆包/自建网关只需改 base-url
      base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}
      model: ${AI_MODEL:deepseek-chat}
      # 服务端兜底密钥。留空表示「必须由前端携带用户自己的 token」。
      # 注意：不要把真实密钥提交到仓库，用环境变量注入。
      api-key: ${AI_API_KEY:}
      # 允许前端用「自己的密钥 + 自定义 Base URL」访问的 HTTPS origin 清单。
      # 只写协议+主机（可带端口），不带路径。用户密钥会由后端发出，目的地址若不限制
      # 就是 SSRF 入口；要接自建网关就把自己可信的 HTTPS 网关登记进来。
      # 服务端自身的 base-url 不受此限制，本地测试服务器照常可用。
      allowed-browser-origins:
        - https://api.deepseek.com
        - https://dashscope.aliyuncs.com
        - https://ark.cn-beijing.volces.com
      timeout-seconds: 60
      max-tokens: 800
      temperature: 0.2

  interview:
    speech:
      # 火山豆包语音，独立于上面的文本模型配置：两套密钥体系不通，
      # 实测方舟 ark- 前缀的 key 调语音接口直接 401，不能借用 AI_API_KEY。
      # 留空表示语音能力关闭，文字面试不受影响。
      api-key: ${VOLC_SPEECH_API_KEY:}
      # ASR 资源按账号实际开通情况填。计划原定 volc.bigasr.auc_turbo，
      # 实测本账号未授权（45000030）；换用 sauc.duration 调同一端点可完整识别。
      asr-resource-id: ${VOLC_ASR_RESOURCE_ID:volc.seedasr.sauc.duration}
      tts-resource-id: ${VOLC_TTS_RESOURCE_ID:seed-tts-2.0}
      # 音色要在该资源下有权限，最终以控制台权限与 smoke test 成功为准。
      tts-speaker: ${VOLC_TTS_SPEAKER:zh_female_vv_uranus_bigtts}
      # 后端转码依赖这两个可执行文件，部署机必须装 FFmpeg（见 backend/docs/语音面试接口与接入.md）。
      ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
      ffprobe-path: ${FFPROBE_PATH:ffprobe}
      max-audio-bytes: 5242880
      max-duration-seconds: 120
      asr-timeout-seconds: 60
      tts-timeout-seconds: 30
      conversion-timeout-seconds: 10
      max-concurrent-requests: 2

logging:
  level:
    com.shijie.resumehelper.job: INFO
