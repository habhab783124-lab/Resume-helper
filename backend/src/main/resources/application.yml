server:
  # 支持用环境变量覆盖，例如本机 8080 被占用时：
  #   $env:SERVER_PORT=8081 ; mvn spring-boot:run
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 1d
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: resume-helper-backend
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # 材料上传。产品方案 3.A 说「单个文件不超过 10MB」。
      #
      # ⚠️ Spring Boot 默认只允许 1MB，不改这里上传稍大一点的简历就会被拒。
      # 这是材料模块最容易踩的坑之一。
      #
      # 合并时这里出现过两个 spring.servlet 块（面试模块原来写的是 5MB），
      # YAML 不允许重复键，会导致 Spring 上下文启动失败。
      # 统一取较大的 10MB：材料模块的校验阈值就是它。
      max-file-size: 10MB
      max-request-size: 12MB
  web:
    resources:
      # 前端静态文件的位置，按顺序查找。
      #
      # 最后两项是给「单进程演示」用的：把 frontend/dist 的内容拷到 jar 同级的 webapp/ 目录，
      # 然后一条 `java -jar` 就能同时提供前端页面和后端接口。
      # 这样演示机器上**不需要 Node、不需要 Maven、不需要联网**，只要有 JDK 17。
      # 前后端还同源，连 vite 代理和 CORS 都不用配。
      #
      # 开发时保留 frontend/dist 这一项，方便本地直接跑打包版。
      static-locations:
        - classpath:/META-INF/resources/
        - classpath:/resources/
        - classpath:/static/
        - classpath:/public/
        - file:./webapp/
        - file:./frontend/dist/

app:
  # ---------------------------------------------------------------------------
  # 账号认证（真实注册 / 邮箱密码登录）
  #
  # 账号保存在本机 data/auth/users.json，密码用 PBKDF2-HMAC-SHA256 加盐哈希，
  # 登录成功后返回 HS256 签名的令牌，前端放在 Authorization: Bearer 里。
  # 正式部署请设置 AUTH_TOKEN_SECRET；否则每次重启都会换临时密钥，用户需重新登录。
  # ---------------------------------------------------------------------------
  auth:
    storage-dir: ${AUTH_STORAGE_DIR:./data/auth}
    token-secret: ${AUTH_TOKEN_SECRET:}
    token-ttl-days: ${AUTH_TOKEN_TTL_DAYS:7}
    # true：所有 /api 业务接口都必须带有效令牌。
    # 只有本机课程演示才建议改成 false（保留可伪造的 X-User-Id 请求头）。
    enforce: ${AUTH_ENFORCE:true}
    password-min-length: 8
    password-max-length: 128

  # ---------------------------------------------------------------------------
  # 大模型配置
  #
  # 放在顶层而不是某个模块下，因为它是**被多个模块共用的基础设施**：
  #   - 岗位模块：生成「为什么匹配 / 差在哪里」的解释
  #   - 材料模块：把简历文本抽成结构化的教育/技能/项目
  # 如果塞进 app.job，材料模块就得反过来依赖岗位模块，依赖方向就错了。
  # ---------------------------------------------------------------------------
  ai:
    # 默认指向 DeepSeek 的 OpenAI 兼容端点；换成通义/豆包/自建网关只需改 base-url
    base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}
    model: ${AI_MODEL:deepseek-chat}
    # 服务端兜底密钥。留空表示「必须由前端携带用户自己的 token」。
    # 注意：不要把真实密钥提交到仓库，用环境变量注入。
    #
    # ⚠️ 如果要把后端暴露到公网，**不要**配这个（否则任何人都能刷光你的额度）。
    api-key: ${AI_API_KEY:}
    # 允许前端用「自己的密钥 + 自定义 Base URL」访问的 HTTPS origin 清单。
    # 只写协议+主机（可带端口），不带路径。用户密钥由后端发出，目的地址若不限制
    # 就是 SSRF 入口；要接自建网关就把自己可信的 HTTPS 网关登记进来。
    # 服务端自身的 base-url 不受此限制，本地测试服务器照常可用。
    allowed-browser-origins:
      - https://api.deepseek.com
      - https://dashscope.aliyuncs.com
      - https://ark.cn-beijing.volces.com
      - https://token.sensenova.cn
    timeout-seconds: 60
    max-tokens: 800
    temperature: 0.2

  # ---------------------------------------------------------------------------
  # 功能一：材料整理
  # ---------------------------------------------------------------------------
  material:
    # 上传的原文件与抽取出的文本存放目录。
    # 相对路径相对于 JVM 工作目录，所以单进程演示时会落在 jar 同级的 data/ 下。
    storage-dir: ${MATERIAL_STORAGE_DIR:./data/materials}
    # 业务层再挡一道（Spring 那边由 spring.servlet.multipart 限制）
    max-file-size-mb: 10
    # 允许的扩展名。旧版 .doc 不在列表里：它是二进制格式，需要额外的 poi-scratchpad，
    # 我们选择明确提示用户「另存为 .docx」，而不是为此多引一个依赖。
    allowed-extensions:
      - pdf
      - docx
      - txt
      - md
    # 扫描件判定：PDF 有页面但抽出的文本短于这个长度，就认为没有文本层（是扫描件/图片）。
    # 判定后不会报错，而是提示用户改用「粘贴文本」。
    scanned-text-threshold: 50
    # 抽取出的原文存不存盘。存下来便于「原文对照」和排查抽取质量问题。
    keep-extracted-text: true

  # ---------------------------------------------------------------------------
  # 功能四：简历生成
  # ---------------------------------------------------------------------------
  resume:
    # 保存的简历版本存放目录
    storage-dir: ${RESUME_STORAGE_DIR:./data/resumes}
    # 每个用户最多保留多少版；超出后提示先删旧版，避免无限增长
    max-versions-per-user: 20
    # 目标岗位描述（JD）长度上限：用户可能粘一整页 JD，截断避免提示词失控
    max-jd-chars: 6000
    # 一次最多给几条改写建议。太多用户看不完，也更费 token
    max-suggestions: 8

  # ---------------------------------------------------------------------------
  # 功能二：岗位来源与匹配
  # ---------------------------------------------------------------------------
  job:
    # 智能体最多检索几轮（换关键词扩检）。轮数越多越费 token。
    max-rounds: 3
    # 最终返回给前端的岗位数量
    default-limit: 12
    # 前 N 个岗位调用大模型生成「为什么匹配 / 差在哪里」，0 表示完全不调用大模型
    explain-top-n: 5
    # 前端的岗位页一次最多取多少条
    max-limit: 50
    cors:
      # 允许跨域的前端来源，支持通配符。
      # 本地开发走 vite 代理时用不到它；前端部署到公网后**必须**把域名加进来，
      # 否则浏览器的跨域检查会失败。部署在 Vercel 的 HTTPS 页面可连接本机回环地址，
      # 但用户的浏览器仍会执行 CORS 和本地网络访问检查。
      #
      # 正式 Vercel 域名已加入下方白名单；其他正式域名按需追加。
      allowed-origin-patterns:
        - http://localhost:*
        - http://127.0.0.1:*
        - https://resume-helper-two.vercel.app
    sources:
      # 内置演示岗位库：外部来源不可用时的兜底，保证岗位页永远有内容
      mock-enabled: true
      # 人工整理的 CSV 岗位库。classpath: 或绝对路径都支持。
      csv-enabled: true
      csv-location: classpath:jobs/sample-jobs.csv

  interview:
    # 面试会话快照存放目录（相对 JVM 工作目录），重启后据此恢复。
    storage-dir: ${INTERVIEW_STORAGE_DIR:./data/interviews}
    # 阶段 A 新快照保留期：创建起 24 小时；历史功能交付后新会话默认 30 天。
    retention-days: 30
    # 首题/后续出题：最多额外自动重试 5 次（总计最多 6 次模型请求）。
    max-retries: 5
    # 一次生成操作的总预算，含排队、每次调用与重试间隔。
    generation-deadline-seconds: 120
    # 单次模型调用的超时上限。
    attempt-timeout-seconds: 60
    # 各次重试前的基础等待（毫秒），实际叠加小幅抖动并尊重 Retry-After。
    retry-delays-ms: [1000, 2000, 4000, 8000, 16000]
    # 后台生成的有界线程池与排队上限；拒绝排队时操作写为明确 FAILED。
    generation-workers: 4
    generation-queue-capacity: 32
    speech:
      # 火山豆包语音，独立于上面的文本模型配置：两套密钥体系不通，
      # 实测方舟 ark- 前缀的 key 调语音接口直接 401，不能借用 AI_API_KEY。
      # 留空表示语音能力关闭，文字面试不受影响。
      # 前端「设置」页填的语音 key 走 X-Speech-Api-Key 请求头，优先于这里；
      # 这里只作服务端兜底（没人填 key 时仍然能用语音）。
      api-key: ${VOLC_SPEECH_API_KEY:}
      # ASR 资源按账号实际开通情况填。计划原定 volc.bigasr.auc_turbo，
      # 实测本账号未授权（45000030）；换用 sauc.duration 调同一端点可完整识别。
      asr-resource-id: ${VOLC_ASR_RESOURCE_ID:volc.seedasr.sauc.duration}
      tts-resource-id: ${VOLC_TTS_RESOURCE_ID:seed-tts-2.0}
      # 音色要在该资源下有权限，最终以控制台权限与 smoke test 成功为准。
      tts-speaker: ${VOLC_TTS_SPEAKER:zh_female_vv_uranus_bigtts}
      # 后端转码依赖这两个可执行文件，部署机必须装 FFmpeg（见 backend/docs/语音面试接口与接入.md）。
      ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
      ffprobe-path: ${FFPROBE_PATH:ffprobe}
      max-audio-bytes: 5242880
      max-duration-seconds: 120
      asr-timeout-seconds: 60
      tts-timeout-seconds: 30
      conversion-timeout-seconds: 10
      max-concurrent-requests: 2
    voice:
      enabled: ${INTERVIEW_VOICE_ENABLED:false}
      ticket-ttl-seconds: 60
      connection-ttl-seconds: 1800
      max-sessions: 32
      max-sessions-per-owner: 4
      first-audio-timeout-seconds: 15
      upstream-idle-timeout-seconds: 15
      stream-timeout-seconds: 180
      max-stream-audio-bytes: 16777216

logging:
  level:
    com.shijie.resumehelper: INFO
    # 抽取质量排查时把这一行打开，可以看到发给大模型的完整提示词
    # com.shijie.resumehelper.material.extract: DEBUG
